[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-app"
version = "0.1.0"
description = "Invoice approval demo app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mutmut>=2.5",
    "pytest-playwright>=0.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src","tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["invoice_app"]
known-local-folder = ["conftest", "fakes"]

[tool.mutmut]
source_paths = ["src/invoice_app/domain/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["tests/", "src/invoice_app/__init__.py", "src/invoice_app/api/"]